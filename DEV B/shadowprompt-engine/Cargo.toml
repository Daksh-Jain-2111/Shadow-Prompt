[package]
name = "shadowprompt-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "shadowprompt_engine"
crate-type = ["cdylib"]

[dependencies]
android_logger = "0.14"
engine-runtime = { path = "../engine-runtime" }
jni = "0.21"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
